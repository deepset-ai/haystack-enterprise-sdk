site_name: Haystack Enterprise SDK
site_description: Haystack Enterprise SDK Documentation
site_url: https://deepset-ai.github.io/haystack-enterprise-sdk/

# Repository
repo_name: deepset-ai/haystack-enterprise-sdk
repo_url: https://github.com/deepset-ai/haystack-enterprise-sdk
edit_uri: ""

theme:
  name: material
  favicon: _images/favicon.svg
  logo: _images/logo-header.svg
  features:
   - content.code.copy
  palette:
   primary: custom

plugins:
  - search
  - mermaid2
  - mkdocstrings

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  version:
    provider: mike

extra_javascript:
  - optionalConfig.js
  - https://unpkg.com/mermaid@9.4.0/dist/mermaid.min.js
  - extra-loader.js

extra_css:
  - _stylesheets/extra.css

# mkdocs uses the `docs` folder as root folder
nav:
  - Home: index.md
  - Get started:
      - Install: get-started/install.md
      - Quickstart: get-started/quickstart.md
      - Configuration: get-started/configuration.md
  - Guides:
      - Deploy a pipeline: guides/deploy-a-pipeline.md
      - Upload files: guides/upload-files.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - CLI: reference/cli.md
  - About:
      - Migrating from deepset-cloud-sdk: about/migrating.md
  - API Docs: # autogenerated within the /docs/_pydoc folder
      - Synchronous SDK: _pydoc/temp/sync_client.md
      - Asynchronous SDK: _pydoc/temp/async_client.md
      - CLI: _pydoc/temp/cli.md
