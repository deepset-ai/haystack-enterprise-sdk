[build-system]
requires = ["uv_build>=0.9.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "haystack-enterprise-sdk"
version = "0.1.0"
description = "Python SDK and CLI for the Haystack Enterprise Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "agents",
  "deepset",
  "haystack",
  "llm",
  "pipelines",
  "rag",
  "sdk",
]
authors = [{ name = "deepset.ai", email = "malte.pietsch@deepset.ai" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "structlog>=24.0.0",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "typer>=0.15.0",
  "click<=8.3.1",          # fixed because of bug in 8.2.1, see https://github.com/pallets/click/issues/2939
  "tenacity>=8.3.0",
  "aiohttp>=3.10.10",
  "aiofiles>=24.1.0",
  "tabulate>=0.9.0",
  "tqdm>=4.66.4",
  "yaspin>=3.0.0",
  "pyrate-limiter>=3.7.0",
  "pydantic>=2.11.4",
  "ruamel.yaml>=0.18.10",
  "sniffio>=1.3.1",
]

[project.optional-dependencies]
# Optional extra for `haystack-enterprise deploy`. The deploy command loads your pipeline in a subprocess
# using your project's own interpreter (auto-detected venv or --python), so the CLI environment does
# NOT need Haystack. Install this extra only when the CLI environment doubles as the pipeline
# environment (i.e. there is no separate project venv to detect).
# Install with: pip install "haystack-enterprise-sdk[deploy]"  (or uv pip install / uv tool install).
deploy = [
  "haystack-ai>=2.13.2",
]

[project.urls]
Documentation = "https://github.com/deepset-ai/haystack-enterprise-sdk#readme"
Issues = "https://github.com/deepset-ai/haystack-enterprise-sdk/issues"
Source = "https://github.com/deepset-ai/haystack-enterprise-sdk"

[project.scripts]
haystack-enterprise = "haystack_enterprise_sdk.cli:run_packaged"

[dependency-groups]
test = [
  "pytest-cov==7.1.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "haystack-ai>=2.13.2",    # only for testing
  "respx==0.23.1",
]
code-quality = [
  "ruff==0.15.12",
  "mypy==1.19.1",
  "pre-commit==4.3.0",
  "types-aiofiles==25.1.0.20260518",
  "types-tabulate==0.9.0.20241207",
]

[tool.uv.build-backend]
module-name = "haystack_enterprise_sdk"
module-root = ""

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
ignore = [
  "E501", # line too long
]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
]
fixable = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["haystack_enterprise_sdk"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
# Sample user projects, not SDK code: they stand in for a customer's pipeline (third-party imports
# and all) and are loaded as fixture data, so they are deliberately not type-checked.
exclude = "^tests/test_data/"

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 150
disable = [
  "fixme",
  "c-extension-no-member",
  "wrong-spelling-in-comment",
  "wrong-spelling-in-docstring",
  "missing-module-docstring",
]

[tool.pylint.'DESIGN']
max-args = 9

[tool.pylint.'SIMILARITIES']
min-similarity-lines = 10

[tool.pylint.'BASIC']
good-names = ["i", "k", "v", "_", "f1"]
