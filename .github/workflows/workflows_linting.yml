name: Github workflows linter

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.24.0"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # actionlint does not yet know the "$/" self-repository reference syntax
      # (https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax/)
      # and reports those refs as malformed. Drop the -ignore once it ships support.
      - name: Run actionlint
        run: actionlint -ignore 'specifying action "\$/'
