name: PyPI Release

on:
  # Publishing a GitHub Release is the single human action that ships a version.
  release:
    types:
      - published
  # Manual dry run uploads a .devN version to TestPyPI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Check the release tag matches the version in pyproject.toml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${TAG#v}"
          project_version="$(uv version --short --frozen)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Release tag '$TAG' resolves to version '$tag_version', but pyproject.toml declares '$project_version'. Bump [project] version on main, run 'uv lock', merge, then re-create the release from a tag on the bump commit."
            exit 1
          fi
          echo "VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Stamp a throwaway dev version
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Each dry run needs a version TestPyPI has not seen before.
          dev_version="$(uv version --short --frozen).dev$(date -u +%Y%m%d%H%M%S)"
          uv version --frozen "$dev_version"
          echo "VERSION=$dev_version" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: make build

      - name: Verify the built wheel
        run: |
          ls -l dist
          wheel="$(ls dist/*.whl)"
          case "$(basename "$wheel")" in
            "haystack_enterprise_sdk-${VERSION}-"*) ;;
            *)
              echo "::error::Wheel '$wheel' does not carry version ${VERSION}. Check PEP 440 normalisation of the version string (write '1.2.3rc1', not '1.2.3-rc1')."
              exit 1
              ;;
          esac
          # Install the wheel into a throwaway environment and run its console
          # script. Proves the entry point, imports, dependency resolution and
          # recorded metadata all work before the upload becomes permanent.
          uv run --no-project --with "$wheel" -- haystack-enterprise --version

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
