name: API Docs

on:
  release:
    types:
      - published

env:
  CATEGORY_ID: ${{ secrets.CATEGORY_ID }}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - name: Setup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Install dependencies for doc generation
        run: |
            python -m pip install --upgrade pip
            pip install -r docs/_pydoc/requirements.txt
            pip install --upgrade setuptools # Fix to prevent: ModuleNotFoundError: No module named 'pkg_resources'


      - name: Generate API docs
        run: ./.github/utils/pydoc-markdown.sh

      - name: Configure git to push docs
        run: |
          git config --global user.name docs-bot
          git config --global user.email docs@bot.com
          git config pull.rebase false
          # mike creates gh-pages on its first deploy, so before that there is no
          # branch to pull and an unconditional pull aborts the job -- which is how
          # the 0.1.0 release shipped to PyPI with no docs.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git pull --allow-unrelated-histories origin gh-pages
          else
            echo "No gh-pages branch yet; mike will create it in this run."
          fi

      - name: Install dependencies for doc deployment
        run: pip install mkdocs-material mkdocstrings[python] mkdocs-mermaid2-plugin mike

      - name: Publish docs to pages
        env:
          # Via env rather than inline ${{ }}, so the tag name reaches bash as data.
          TAG: ${{ github.ref_name }}
        run: |
          # Release tags carry a leading `v`; the docs version should read like the
          # version on PyPI, so tag v0.1.1 publishes as 0.1.1.
          version="${TAG#v}"
          mike deploy --push --update-aliases "$version"
          mike set-default --push "$version"

      - name: Add Category ID to all API docs
        run: python ./.github/utils/add-category-id.py
        env:
          MARKDOWN_FILES_DIRECTORY: docs/_pydoc/temp/
          CATEGORY_ID: ${{env.CATEGORY_ID}}

      - name: Run `docs` command 🚀
        uses: readmeio/rdme@191a35d0bbea63de193d0efb357efbc5c977c6b3 # v10.9.6
        with:
          rdme: docs docs/_pydoc/temp --key=${{ secrets.README_API_KEY }} --version=1.0
