name: Compliance Checks

on:
  push:
    paths:
      - 'pyproject.toml'
      # A transitive bump changes only the lockfile, and it can still pull in a
      # new licence, so the scan has to see uv.lock too.
      - 'uv.lock'
  schedule:
    - cron: '0 0 * * *'  # every day at midnight

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_ALERT_CHANNEL: "#dc-alerts"

permissions:
  contents: read

jobs:
  check-license-compliance:
    name: Check license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install prod dependencies
        run: |
          uv sync
          uv export --no-dev --no-hashes > requirements.txt

      - name: Create file with full dependency list
        run: |
          uv pip freeze > requirements-full.txt

      - name: Send license report to Fossa
        # This will collect all necessary information (mostly used dependencies) and send it to the Fossa API.
        # FOSSA_LICENSE_SCAN_TOKEN has to exist in BOTH secret stores: Dependabot-triggered
        # runs only ever see Dependabot secrets, never the organisation's Actions secrets.
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # Use a specific version if locking is preferred
        with:
          api-key: ${{ secrets.FOSSA_LICENSE_SCAN_TOKEN }}

      - name: Check license compliance
        # This will poll the Fossa API until they have processed the information which we've sent in the previous step
        # and fail if Fossa found an issue with the licences of our dependencies.
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # Use a specific version if locking is preferred
        with:
          api-key: ${{ secrets.FOSSA_LICENSE_SCAN_TOKEN }}
          run-tests: true

      - name: Send Slack notification if license check failed
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054
        if: failure() && github.ref == 'refs/heads/main'
        with:
          status: ${{ job.status }}
          channel: ${{ env.SLACK_ALERT_CHANNEL }}
