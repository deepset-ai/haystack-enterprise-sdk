# See all config options here https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # This project is managed with uv, so the resolved versions live in uv.lock.
  # The "pip" ecosystem does not read that lockfile, which is why Dependabot has
  # never opened a version-update PR here even though the config looked correct.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build: "
    groups:
      python-production-updates:
        dependency-type: "production"
        update-types:
          - "major"
          - "minor"
          - "patch"
      python-development-updates:
        dependency-type: "development"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # The API reference build pins its own requirements outside the uv project.
  - package-ecosystem: "pip"
    directory: "/docs/_pydoc"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build: "
    groups:
      pydoc-updates:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci: "
    groups:
      # Specify a name for the group, which will be used in pull request titles
      # and branch names
      ci-updates:
        update-types:
          - "minor"
          - "patch"
          - "major"
